spring:
  application:
    name: finsight

  datasource:
    # Optimized JDBC URL for PostgreSQL with batch insert rewriting, TCP keep-alive, and unspecified string binding
    url: jdbc:postgresql://localhost:5432/finsight?reWriteBatchedInserts=true&stringtype=unspecified&tcpKeepAlive=true
    username: finsight_user
    password: finsight_dev_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      # Named connection pool for clear observability in JMX, Actuator metrics, and thread dumps
      pool-name: FinSightHikariPool
      # Maximum number of active connections — sized to handle expected concurrent request spikes without exhausting PostgreSQL backends
      maximum-pool-size: 10
      # Minimum number of idle connections maintained to eliminate initial handshake latency on incoming traffic
      minimum-idle: 5
      # 20 seconds maximum wait time for a worker thread to acquire a connection before throwing a SQLTimeoutException
      connection-timeout: 20000
      # 5 minutes maximum idle time before connections above minimum-idle are retired and closed
      idle-timeout: 300000
      # 30 minutes maximum lifetime of a physical connection to prevent stale TCP sockets and server-side resource leaks
      max-lifetime: 1800000
      # 30 seconds connection leak detection threshold for logging unreturned connections during development
      leak-detection-threshold: 30000

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  jpa:
    hibernate:
      # Strict schema enforcement: Hibernate must never alter or create tables; Flyway is single source of truth
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # PostgreSQL write optimizations: order inserts/updates and batch queries
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
